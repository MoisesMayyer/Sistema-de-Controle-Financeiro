[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-controle-financeiro"
version = "0.1.0"
description = "API REST de controle financeiro pessoal com FastAPI, SQLAlchemy e SQLite"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "httpx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
